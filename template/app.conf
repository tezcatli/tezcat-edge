# Template — copy to your app repo as deploy/myapp.conf and replace `myapp`.
#
# The deploy ships this to ~/opt/edge/conf.d/10-myapp.conf. It lives in your
# repo, not in tezcat-edge, because it encodes application knowledge — which
# routes stream, which are slow, which need a longer body limit — and that
# should change in the same commit as the code that makes it true.
#
# `resolver` and the snippets come from the edge's own 0* config.
#
# Issue the certificate BEFORE this file first lands: nginx will not start with
# an ssl_certificate path that does not exist, and it would take every other app
# on the host down with it.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myapp.tezcat.fr;

    ssl_certificate     /etc/letsencrypt/live/myapp.tezcat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myapp.tezcat.fr/privkey.pem;

    # Server level, once. nginx does not merge add_header across levels: any
    # location that sets a header of its own drops every inherited one, so a
    # location that adds headers must re-include this.
    include /etc/nginx/conf.d/snippets/security-headers.inc;

    # REQUIRED: upstreams through a variable, so Docker's resolver looks them up
    # per request. With a literal name nginx resolves at startup and refuses to
    # start whenever this app happens to be down — taking every other app with
    # it, on a restart that might be weeks after the change that caused it.
    set $myapp_api http://myapp-backend:8000;
    set $myapp_web http://myapp-web;

    location /api/ {
        proxy_pass $myapp_api;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
    }

    # A prefix location ending in `/` never matches the bare form. If `/api` is
    # itself an endpoint, without this it falls through to the catch-all below
    # and the caller gets HTML with a 200 where it asked for JSON — which is a
    # far worse failure than a 404. Delete this block if `/api` is not a real
    # endpoint; check-app.sh warns rather than blocks, because plenty of
    # prefixes have no meaningful bare form.
    location = /api {
        proxy_pass $myapp_api;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
    }

    # Server-sent events, if you have any: buffering must be off or the client
    # receives nothing until a buffer fills, and the read timeout has to outlive
    # a quiet stream.
    # location = /api/stream {
    #     proxy_pass $myapp_api;
    #     include /etc/nginx/conf.d/snippets/proxy-headers.inc;
    #     proxy_buffering    off;
    #     proxy_cache        off;
    #     proxy_read_timeout 300s;
    # }

    location / {
        proxy_pass $myapp_web;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
    }
}
