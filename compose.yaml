services:
  nginx:
    # Pinned to nginx's stable line, not the floating `alpine`: the tag names
    # what runs, the CI checks validate the config with this same image, and a
    # new stable line arrives as a Dependabot PR. Patch releases within the line
    # come in when deploy-edge.yml recreates the container (it pulls first).
    image: nginx:1.30-alpine
    # Deliberate: the certbot deploy hook (renewal-hooks/deploy/reload-edge.sh)
    # signals this container by name. It is the one place that coupling lives.
    container_name: edge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot:/var/www/certbot
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created once, out of band: docker network create edge
  # Apps join it from their own compose projects; see README.
  edge:
    name: edge
    external: true
