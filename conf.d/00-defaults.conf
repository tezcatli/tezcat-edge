# http-level defaults shared by every app behind this edge.
# Files in conf.d/ are included inside http{}, so directives at the top level of
# this file are http-level and apply to all server blocks.

# Docker's embedded DNS. App fragments resolve their upstreams through a
# variable (set $up ...; proxy_pass http://$up;) so names are looked up per
# request rather than at startup. Without this, nginx refuses to start when any
# single app's container is down — taking every other app with it.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
