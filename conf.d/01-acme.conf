# One port-80 block for every hostname, so issuing a certificate for a new app
# needs no config change here at all: point the subdomain at this host and run
#   certbot certonly --webroot -w ~/opt/edge/certbot -d <app>.tezcat.fr
#
# This is also what lets renewal happen with zero downtime. The previous setup
# used certbot's standalone authenticator, which had to stop nginx to free :80
# (pre_hook = docker stop ...). With one app that was a blip; with several it
# would take every app down on every renewal.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The container healthcheck probes this. It has to be an exact-match
    # location that answers in place: anything falling through to the redirect
    # below sends the probe to :443, where the catch-all serves a certificate
    # for a name it did not ask for, and the probe fails on a healthy edge.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
