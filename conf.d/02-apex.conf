# The apex domain, plus the catch-all for hostnames no app claims.
#
# Without an explicit 443 default_server, nginx serves whichever server block it
# loaded first to anyone connecting by IP or by a stale DNS name — which means
# the alphabetically-first app answers for every unclaimed hostname. Be explicit.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/tezcat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tezcat.fr/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tezcat.fr;

    ssl_certificate     /etc/letsencrypt/live/tezcat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tezcat.fr/privkey.pem;

    include /etc/nginx/conf.d/snippets/security-headers.inc;

    # The Ludothèque app used to live at tezcat.fr/silence/, and now lives at the
    # root of its own subdomain. Keep this indefinitely: it costs one server
    # block and it is what stops old bookmarks and already-installed PWAs from
    # breaking.
    #
    # The rewrite strips the old prefix while preserving the rest of the path, so
    # tezcat.fr/silence/game/zelda still lands on the right page rather than the
    # home screen. Everything else on the apex forwards unchanged.
    rewrite ^/silence/?(.*)$ https://ludo.tezcat.fr/$1 permanent;
    return 301 https://ludo.tezcat.fr$request_uri;
}
