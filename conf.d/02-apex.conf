# The apex domain, plus the catch-all for hostnames no app claims.
#
# Without an explicit 443 default_server, nginx serves whichever server block it
# loaded first to anyone connecting by IP or by a stale DNS name — which means
# the alphabetically-first app answers for every unclaimed hostname. Be explicit.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/tezcat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tezcat.fr/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tezcat.fr;

    ssl_certificate     /etc/letsencrypt/live/tezcat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tezcat.fr/privkey.pem;

    include /etc/nginx/conf.d/snippets/security-headers.inc;

    # The Ludothèque app used to live at tezcat.fr/silence/. Keep this
    # indefinitely: it costs one server block and it is what stops old bookmarks
    # and already-installed PWAs from breaking.
    #
    # NOTE for the /silence prefix removal: once the app is served from the root
    # of ludo.tezcat.fr, this needs to strip the prefix rather than carry it —
    #   location /silence/ { return 301 https://ludo.tezcat.fr/; }
    return 301 https://ludo.tezcat.fr$request_uri;
}
